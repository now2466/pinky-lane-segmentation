repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: public-source
        name: Check public source for private paths and artifacts
        entry: python3 scripts/check_public_source.py
        language: system
        pass_filenames: false
        always_run: true
