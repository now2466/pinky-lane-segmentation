[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pinky-lane-segmentation"
version = "0.1.0"
description = "Checkpoint-compatible LaneUNet training and inference for Pinky track segmentation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = ["torch==2.9.1", "numpy==2.2.6", "opencv-python-headless==4.12.0.88"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pre-commit>=4,<5", "ruff>=0.12,<0.13"]

[project.scripts]
pinky-train = "pinky_lane.train:main"
pinky-evaluate = "pinky_lane.evaluate:main"
pinky-infer-image = "pinky_lane.infer_image:main"
pinky-infer-video = "pinky_lane.infer_video:main"
pinky-export = "pinky_lane.export:main"
pinky-check-dataset = "pinky_lane.dataset:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
